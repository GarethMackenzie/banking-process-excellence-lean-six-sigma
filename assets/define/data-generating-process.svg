<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><style>text{font-family:Arial,sans-serif;fill:#111} .b{fill:#f2f2f2;stroke:#444;stroke-width:2} .a{stroke:#333;stroke-width:2;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs><rect class="b" x="40" y="110" width="180" height="80" rx="10"/><text x="70" y="145">Staffing / outages</text><text x="70" y="168">and demand</text><rect class="b" x="300" y="110" width="180" height="80" rx="10"/><text x="350" y="150">Capacity</text><rect class="b" x="560" y="110" width="180" height="80" rx="10"/><text x="610" y="150">Backlog</text><rect class="b" x="820" y="110" width="180" height="80" rx="10"/><text x="855" y="150">Queue wait</text><rect class="b" x="1020" y="110" width="150" height="80" rx="10"/><text x="1040" y="145">Activation</text><text x="1040" y="168">CTQ</text><line class="a" x1="220" y1="150" x2="300" y2="150"/><line class="a" x1="480" y1="150" x2="560" y2="150"/><line class="a" x1="740" y1="150" x2="820" y2="150"/><line class="a" x1="1000" y1="150" x2="1020" y2="150"/><rect class="b" x="390" y="240" width="200" height="70" rx="10"/><text x="430" y="270">Defects → rework</text><text x="430" y="293">→ failure cost</text><line class="a" x1="590" y1="275" x2="900" y2="190"/></svg>