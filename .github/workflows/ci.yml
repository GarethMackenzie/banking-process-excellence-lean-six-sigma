name: Project QA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src scripts
      # Reproduce the canonical build, including statistical QA and project QA.
      # build_project.py uses the fixed seed and runs the complete analysis chain.
      - run: python scripts/build_project.py
